<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia</title>
<link rel="icon" type="image/jpeg" href="favicon.jpeg">
<link rel="apple-touch-icon" href="favicon.jpeg">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0f08;
    color: #f4f1e8;
  }
  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    position: relative;
  }
  canvas#water {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
  }
  .scrim {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(8, 10, 4, 0.45), rgba(8, 10, 4, 0.55));
    pointer-events: none;
    z-index: 1;
  }
  body.static-bg canvas#water {
    display: none;
  }
  body.static-bg {
    background-image: linear-gradient(rgba(8, 10, 4, 0.45), rgba(8, 10, 4, 0.55)), url("garden.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  body.static-bg .scrim {
    display: none;
  }
  #cursor-dot {
    position: fixed;
    top: 0;
    left: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(200, 198, 190, 0.4);
    filter: blur(1.5px);
    pointer-events: none;
    transform: translate(-999px, -999px) translate(-50%, -50%);
    opacity: 0;
    z-index: 9999;
    will-change: transform;
    transition: transform 0.09s ease-out, opacity 0.2s ease;
  }
  body.custom-cursor {
    cursor: none;
  }
</style>
</head>
<body>
  <canvas id="water"></canvas>
  <div class="scrim"></div>
  <div id="cursor-dot"></div>
  <script src="ripple.js"></script>
  <script>
    (function () {
      if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
      var dot = document.getElementById("cursor-dot");
      if (!dot) return;
      document.body.classList.add("custom-cursor");
      window.addEventListener("mousemove", function (e) {
        dot.style.opacity = "1";
        dot.style.transform = "translate(" + e.clientX + "px, " + e.clientY + "px) translate(-50%, -50%)";
      });
      window.addEventListener("mouseleave", function () {
        dot.style.opacity = "0";
      });
    })();
  </script>
</body>
</html>
