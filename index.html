<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia</title>
<link rel="icon" type="image/jpeg" href="favicon.jpeg">
<link rel="apple-touch-icon" href="favicon.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0f08;
    color: #f4f1e8;
  }
  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    position: relative;
  }
  canvas#water {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
  }
  .scrim {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(8, 10, 4, 0.45), rgba(8, 10, 4, 0.55));
    pointer-events: none;
    z-index: 1;
  }
  body.static-bg canvas#water {
    display: none;
  }
  body.static-bg {
    background-image: linear-gradient(rgba(8, 10, 4, 0.45), rgba(8, 10, 4, 0.55)), url("garden.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  body.static-bg .scrim {
    display: none;
  }
  .card {
    position: relative;
    z-index: 2;
    max-width: min(540px, 88vw);
    max-height: 92vh;
    padding: 0 24px;
  }
  .logo-row {
    position: relative;
    height: clamp(18px, 4.5vh, 32px);
    margin: 0 0 20px 0;
  }
  img.logo {
    display: block;
    height: 100%;
    width: auto;
  }
  .icon-wrap {
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    height: clamp(90px, 20vh, 180px);
  }
  img.icon {
    display: block;
    height: 100%;
    width: auto;
  }
  @media (max-width: 640px) {
    .icon-wrap {
      display: none;
    }
  }
  p.pos {
    font-size: clamp(11px, 1.8vh, 13px);
    font-style: italic;
    color: rgba(244, 241, 232, 0.65);
    margin: 0;
  }
  hr {
    border: none;
    border-top: 1px solid rgba(244, 241, 232, 0.25);
    margin: 32px 0;
  }
  p.def {
    font-size: clamp(12px, 2vh, 14px);
    line-height: 1.6;
    color: #f4f1e8;
    margin: 0 0 32px 0;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
  }
  a.become {
    font-size: clamp(12px, 2vh, 14px);
    color: #f4f1e8;
    text-decoration: none;
    border: 1px solid rgba(244, 241, 232, 0.65);
    padding: 8px 18px;
    letter-spacing: 0.03em;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  a.become:hover {
    background-color: #f4f1e8;
    color: #0d0f08;
  }
  a.become:active {
    background-color: #39ff14;
    border-color: #39ff14;
    color: #ffffff;
  }
  #cursor-dot {
    position: fixed;
    top: 0;
    left: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(200, 198, 190, 0.4);
    filter: blur(1.5px);
    pointer-events: none;
    transform: translate(-999px, -999px) translate(-50%, -50%);
    opacity: 0;
    z-index: 9999;
    will-change: transform;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    white-space: nowrap;
    padding: 0;
    box-sizing: border-box;
    border: 1px solid transparent;
    transition:
      transform 0.09s ease-out,
      opacity 0.2s ease,
      width 0.32s cubic-bezier(0.22, 1, 0.36, 1),
      height 0.32s cubic-bezier(0.22, 1, 0.36, 1),
      border-radius 0.32s cubic-bezier(0.22, 1, 0.36, 1),
      background-color 0.32s ease,
      filter 0.32s ease,
      padding 0.32s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.32s ease,
      border-color 0.32s ease;
  }
  #cursor-dot.active {
    width: 110px;
    height: 38px;
    border-radius: 999px;
    background: rgba(18, 20, 14, 0.72);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(244, 241, 232, 0.22);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    filter: none;
    padding: 0 14px;
  }
  #cursor-dot .cursor-label {
    color: #f4f1e8;
    font-family: "IBM Plex Mono", "Courier New", monospace;
    font-size: 13px;
    letter-spacing: 0.02em;
    display: flex;
    align-items: center;
    gap: 6px;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 0.18s ease, transform 0.18s ease;
  }
  #cursor-dot.active .cursor-label {
    opacity: 1;
    transform: scale(1);
    transition-delay: 0.12s;
  }
  #cursor-dot .cursor-label svg {
    width: 12px;
    height: 12px;
    flex-shrink: 0;
  }
  body.custom-cursor,
  body.custom-cursor a,
  body.custom-cursor button {
    cursor: none;
  }
</style>
</head>
<body>
  <canvas id="water"></canvas>
  <div class="scrim"></div>
  <div class="card">
    <div class="logo-row">
      <img class="logo" src="Arcadia1-white.png" alt="Arcadia">
      <a class="icon-wrap" href="#" id="icon-link" aria-label="About us">
        <img class="icon" src="folder-icon.png" alt="">
      </a>
    </div>
    <p class="pos" data-scramble>noun / ar&#8231;ca&#8231;dia</p>
    <hr>
    <p class="def" data-scramble>a real or imaginary place of rural peace, rustic innocence, and simple quiet pleasure. the term comes from a mountainous region in Greece that became a symbol of an ideal, untroubled life in nature.</p>
    <a class="become" href="#" data-scramble>become an Arcadian</a>
  </div>
  <div id="cursor-dot">
    <span class="cursor-label">
      about us
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
    </span>
  </div>
  <script src="scramble.js"></script>
  <script src="ripple.js"></script>
  <script>
    (function () {
      if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
      var dot = document.getElementById("cursor-dot");
      if (!dot) return;
      document.body.classList.add("custom-cursor");
      window.addEventListener("mousemove", function (e) {
        dot.style.opacity = "1";
        dot.style.transform = "translate(" + e.clientX + "px, " + e.clientY + "px) translate(-50%, -50%)";
      });
      window.addEventListener("mouseleave", function () {
        dot.style.opacity = "0";
      });

      var iconLink = document.getElementById("icon-link");
      if (iconLink) {
        iconLink.addEventListener("mouseenter", function () {
          dot.classList.add("active");
        });
        iconLink.addEventListener("mouseleave", function () {
          dot.classList.remove("active");
        });
      }
    })();
  </script>
</body>
</html>
