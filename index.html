<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0f08;
    color: #f4f1e8;
  }
  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    background-image: linear-gradient(rgba(8, 10, 4, 0.45), rgba(8, 10, 4, 0.55)), url("garden.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  .card {
    max-width: min(540px, 88vw);
    max-height: 92vh;
    padding: 0 24px;
  }
  img.logo {
    display: block;
    height: clamp(18px, 4.5vh, 32px);
    width: auto;
    margin: 0 0 20px 0;
    filter: brightness(0) invert(1);
  }
  p.pos {
    font-size: clamp(11px, 1.8vh, 13px);
    font-style: italic;
    color: rgba(244, 241, 232, 0.65);
    margin: 0;
  }
  hr {
    border: none;
    border-top: 1px solid rgba(244, 241, 232, 0.25);
    margin: 32px 0;
  }
  p.def {
    font-size: clamp(12px, 2vh, 14px);
    line-height: 1.6;
    color: #f4f1e8;
    margin: 0 0 32px 0;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
  }
  a.join {
    font-size: clamp(12px, 2vh, 14px);
    color: #f4f1e8;
    text-decoration: none;
    border-bottom: 1px solid rgba(244, 241, 232, 0.65);
    padding-bottom: 1px;
  }
  a.join:hover {
    opacity: 0.7;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="Arcadia1.png" alt="Arcadia">
    <p class="pos">noun / ar&#8231;ca&#8231;dia</p>
    <hr>
    <p class="def">a real or imaginary place of rural peace, rustic innocence, and simple quiet pleasure. the term comes from a mountainous region in Greece that became a symbol of an ideal, untroubled life in nature.</p>
    <a class="join" href="#">learn more &raquo;</a>
  </div>
</body>
</html>
