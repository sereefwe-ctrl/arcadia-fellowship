<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0f08;
    color: #f4f1e8;
  }
  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    position: relative;
  }
  canvas#water {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
  }
  .scrim {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(8, 10, 4, 0.45), rgba(8, 10, 4, 0.55));
    pointer-events: none;
    z-index: 1;
  }
  body.static-bg canvas#water {
    display: none;
  }
  body.static-bg {
    background-image: linear-gradient(rgba(8, 10, 4, 0.45), rgba(8, 10, 4, 0.55)), url("garden.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  body.static-bg .scrim {
    display: none;
  }
  .card {
    position: relative;
    z-index: 2;
    max-width: min(540px, 88vw);
    max-height: 92vh;
    padding: 0 24px;
  }
  .logo-row {
    position: relative;
    height: clamp(18px, 4.5vh, 32px);
    margin: 0 0 20px 0;
  }
  img.logo {
    display: block;
    height: 100%;
    width: auto;
  }
  img.icon {
    display: block;
    position: absolute;
    right: 24px;
    top: 50%;
    transform: translateY(-50%);
    height: clamp(90px, 20vh, 180px);
    width: auto;
  }
  @media (max-width: 640px) {
    img.icon {
      display: none;
    }
  }
  p.pos {
    font-size: clamp(11px, 1.8vh, 13px);
    font-style: italic;
    color: rgba(244, 241, 232, 0.65);
    margin: 0;
  }
  hr {
    border: none;
    border-top: 1px solid rgba(244, 241, 232, 0.25);
    margin: 32px 0;
  }
  p.def {
    font-size: clamp(12px, 2vh, 14px);
    line-height: 1.6;
    color: #f4f1e8;
    margin: 0 0 32px 0;
    text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
  }
  a.become {
    font-size: clamp(12px, 2vh, 14px);
    color: #f4f1e8;
    text-decoration: none;
    border: 1px solid rgba(244, 241, 232, 0.65);
    padding: 8px 18px;
    letter-spacing: 0.03em;
    transition: background-color 0.2s ease, color 0.2s ease;
  }
  a.become:hover {
    background-color: #f4f1e8;
    color: #0d0f08;
  }
</style>
</head>
<body>
  <canvas id="water"></canvas>
  <div class="scrim"></div>
  <div class="card">
    <div class="logo-row">
      <img class="logo" src="Arcadia1-white.png" alt="Arcadia">
      <img class="icon" src="folder-icon.png" alt="">
    </div>
    <p class="pos" data-scramble>noun / ar&#8231;ca&#8231;dia</p>
    <hr>
    <p class="def" data-scramble>a real or imaginary place of rural peace, rustic innocence, and simple quiet pleasure. the term comes from a mountainous region in Greece that became a symbol of an ideal, untroubled life in nature.</p>
    <a class="become" href="#" data-scramble>become an Arcadian</a>
  </div>
  <script src="scramble.js"></script>
  <script src="ripple.js"></script>
</body>
</html>
