<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia — Arcadians</title>
<link rel="icon" type="image/jpeg" href="favicon.jpeg">
<link rel="apple-touch-icon" href="favicon.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0f08;
    color: #f4f1e8;
  }
  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    position: relative;
  }
  canvas#water {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
  }
  .scrim {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(8, 10, 4, 0.5), rgba(8, 10, 4, 0.62));
    pointer-events: none;
    z-index: 1;
  }
  body.static-bg canvas#water {
    display: none;
  }
  body.static-bg {
    background-image: linear-gradient(rgba(8, 10, 4, 0.5), rgba(8, 10, 4, 0.62)), url("garden.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  body.static-bg .scrim {
    display: none;
  }
  .card {
    position: relative;
    z-index: 2;
    max-width: min(540px, 88vw);
    padding: 0 24px;
  }
  a.back {
    display: inline-block;
    font-size: 13px;
    color: rgba(244, 241, 232, 0.65);
    text-decoration: none;
    letter-spacing: 0.03em;
    margin: 0 0 28px 0;
    transition: color 0.2s ease;
  }
  a.back:hover {
    color: #f4f1e8;
  }
  img.logo {
    display: block;
    height: 26px;
    width: auto;
    margin: 0 0 28px 0;
  }
  p.label {
    font-size: 13px;
    font-style: italic;
    color: rgba(244, 241, 232, 0.65);
    margin: 0;
  }
  hr {
    border: none;
    border-top: 1px solid rgba(244, 241, 232, 0.25);
    margin: 24px 0 0;
  }
  #cursor-dot {
    position: fixed;
    top: 0;
    left: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(244, 241, 232, 0.4);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border: 1px solid rgba(244, 241, 232, 0.55);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    filter: none;
    pointer-events: none;
    transform: translate(-999px, -999px) translate(-50%, -50%);
    opacity: 0;
    z-index: 9999;
    will-change: transform;
    transition: transform 0.09s ease-out, opacity 0.2s ease;
  }
  body.custom-cursor,
  body.custom-cursor a {
    cursor: none;
  }
</style>
</head>
<body>
  <canvas id="water"></canvas>
  <div class="scrim"></div>
  <div class="card">
    <a class="back" href="index.html" data-scramble>&lsaquo; back</a>
    <img class="logo" src="Arcadia1-white.png" alt="Arcadia">
    <p class="label" data-scramble>about arcadia</p>
    <hr>
  </div>
  <div id="cursor-dot"></div>
  <script src="scramble.js"></script>
  <script src="ripple.js"></script>
  <script>
    (function () {
      if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
      var dot = document.getElementById("cursor-dot");
      if (!dot) return;
      document.body.classList.add("custom-cursor");
      window.addEventListener("mousemove", function (e) {
        dot.style.opacity = "1";
        dot.style.transform = "translate(" + e.clientX + "px, " + e.clientY + "px) translate(-50%, -50%)";
      });
      window.addEventListener("mouseleave", function () {
        dot.style.opacity = "0";
      });
    })();
  </script>
</body>
</html>
