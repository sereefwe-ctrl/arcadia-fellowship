<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arcadia — Arcadians</title>
<link rel="icon" type="image/jpeg" href="favicon.jpeg">
<link rel="apple-touch-icon" href="favicon.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0d0f08;
    color: #f4f1e8;
  }
  body {
    font-family: "IBM Plex Mono", "Courier New", monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    position: relative;
  }
  canvas#water {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    display: block;
    z-index: 0;
  }
  .scrim {
    position: fixed;
    inset: 0;
    background: linear-gradient(rgba(8, 10, 4, 0.5), rgba(8, 10, 4, 0.62));
    pointer-events: none;
    z-index: 1;
  }
  body.static-bg canvas#water {
    display: none;
  }
  body.static-bg {
    background-image: linear-gradient(rgba(8, 10, 4, 0.5), rgba(8, 10, 4, 0.62)), url("garden.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  }
  body.static-bg .scrim {
    display: none;
  }
  .card {
    position: relative;
    z-index: 2;
    max-width: min(540px, 88vw);
    padding: 0 24px;
  }
  a.back {
    display: inline-block;
    font-size: 13px;
    color: rgba(244, 241, 232, 0.65);
    text-decoration: none;
    letter-spacing: 0.03em;
    margin: 0 0 28px 0;
    transition: color 0.2s ease;
  }
  a.back:hover {
    color: #f4f1e8;
  }
  .logo-row {
    display: flex;
    align-items: center;
    gap: 18px;
    margin: 0 0 32px 0;
  }
  img.logo {
    display: block;
    height: 26px;
    width: auto;
  }
  img.gate-icon {
    display: block;
    height: 64px;
    width: auto;
    filter: drop-shadow(0 0 5px rgba(197, 214, 190, 0.5)) drop-shadow(0 0 16px rgba(197, 214, 190, 0.3));
    animation: float 4.5s ease-in-out infinite;
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }
  p.label {
    font-size: 13px;
    font-style: italic;
    color: rgba(244, 241, 232, 0.65);
    margin: 0 0 18px 0;
  }
  .password-box {
    display: flex;
    align-items: center;
    gap: 12px;
    background: rgba(26, 42, 30, 0.55);
    backdrop-filter: blur(14px) saturate(140%);
    -webkit-backdrop-filter: blur(14px) saturate(140%);
    border: 1px solid rgba(197, 214, 190, 0.28);
    border-radius: 999px;
    padding: 13px 18px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.08);
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .password-box:focus-within {
    border-color: rgba(197, 214, 190, 0.65);
    box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), 0 0 22px rgba(197, 214, 190, 0.25), inset 0 1px 0 rgba(255, 255, 255, 0.08);
  }
  .password-box.shake {
    animation: shake 0.32s ease;
    border-color: rgba(255, 120, 100, 0.7);
  }
  .lock-icon {
    flex: 0 0 auto;
    width: 14px;
    height: 14px;
    color: rgba(244, 241, 232, 0.55);
  }
  #password-input {
    flex: 1 1 auto;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    font-family: inherit;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: #f4f1e8;
    padding: 0;
  }
  #password-input::placeholder {
    color: rgba(244, 241, 232, 0.4);
    font-style: italic;
    letter-spacing: 0.03em;
  }
  #password-submit {
    flex: 0 0 auto;
    background: none;
    border: none;
    padding: 0;
    color: rgba(244, 241, 232, 0.7);
    cursor: pointer;
    display: flex;
    align-items: center;
    transition: color 0.2s ease, transform 0.2s ease;
  }
  #password-submit:hover {
    color: #f4f1e8;
    transform: translate(1px, -1px);
  }
  #password-submit svg {
    width: 14px;
    height: 14px;
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(6px); }
    60% { transform: translateX(-4px); }
    80% { transform: translateX(4px); }
  }
  hr {
    border: none;
    border-top: 1px solid rgba(244, 241, 232, 0.25);
    margin: 28px 0 0;
  }
  #cursor-dot {
    position: fixed;
    top: 0;
    left: 0;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: rgba(244, 241, 232, 0.4);
    backdrop-filter: blur(10px) saturate(140%);
    -webkit-backdrop-filter: blur(10px) saturate(140%);
    border: 1px solid rgba(244, 241, 232, 0.55);
    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
    filter: none;
    pointer-events: none;
    transform: translate(-999px, -999px) translate(-50%, -50%);
    opacity: 0;
    z-index: 9999;
    will-change: transform;
    transition: transform 0.09s ease-out, opacity 0.2s ease;
  }
  body.custom-cursor,
  body.custom-cursor a {
    cursor: none;
  }
</style>
</head>
<body>
  <canvas id="water"></canvas>
  <div class="scrim"></div>
  <div class="card">
    <a class="back" href="index.html" data-scramble>&lsaquo; back</a>
    <div class="logo-row">
      <img class="logo" src="Arcadia1-white.png" alt="Arcadia">
      <img class="gate-icon" src="celestial-folder-icon.png" alt="">
    </div>
    <p class="label" data-scramble>you must be one to enter</p>
    <div class="password-box" id="password-box">
      <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 0 1 8 0v4"></path></svg>
      <input type="password" id="password-input" placeholder="password" autocomplete="off" spellcheck="false">
      <button type="button" id="password-submit" aria-label="submit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>
      </button>
    </div>
    <hr>
  </div>
  <div id="cursor-dot"></div>
  <script src="scramble.js"></script>
  <script src="ripple.js"></script>
  <script>
    (function () {
      if (!window.matchMedia || !window.matchMedia("(pointer: fine)").matches) return;
      var dot = document.getElementById("cursor-dot");
      if (!dot) return;
      document.body.classList.add("custom-cursor");
      window.addEventListener("mousemove", function (e) {
        dot.style.opacity = "1";
        dot.style.transform = "translate(" + e.clientX + "px, " + e.clientY + "px) translate(-50%, -50%)";
      });
      window.addEventListener("mouseleave", function () {
        dot.style.opacity = "0";
      });
    })();

    (function () {
      var box = document.getElementById("password-box");
      var input = document.getElementById("password-input");
      var submit = document.getElementById("password-submit");
      if (!box || !input || !submit) return;

      var CORRECT_PASSWORD = "@iamanarcadian";

      function tryUnlock() {
        if (CORRECT_PASSWORD !== null && input.value === CORRECT_PASSWORD) {
          window.location.href = "index.html";
          return;
        }
        box.classList.remove("shake");
        void box.offsetWidth;
        box.classList.add("shake");
      }

      submit.addEventListener("click", tryUnlock);
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter") tryUnlock();
      });
    })();
  </script>
</body>
</html>
